    <text x="72" y="742"><tspan fill="#9AA86B">+    return blossom(path)</tspan></text>
    <text x="72" y="772"><tspan fill="#7FA3B8">~/petals</tspan><tspan fill="#E6DFD3"> on </tspan><tspan fill="#BE8AA2"> main</tspan><tspan fill="#9AA86B"> ❯ </tspan><tspan fill="#E6DFD3">git log --oneline -3</tspan></text>
    <text x="72" y="802"><tspan fill="#BE8AA2">* </tspan><tspan fill="#D6B787">9f3c1a2 </tspan><tspan fill="#9AA86B">(HEAD -&gt; main) </tspan><tspan fill="#E6DFD3">Add spring palette</tspan></text>
    <text x="72" y="832"><tspan fill="#BE8AA2">* </tspan><tspan fill="#D6B787">2a7c9d1 </tspan><tspan fill="#E6DFD3">Fix petal sorting on WSL</tspan></text>
