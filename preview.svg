    <text x="72" y="892"><tspan fill="#D8959F">def </tspan><tspan fill="#7FA3B8">blossom</tspan><tspan fill="#E6DFD3">(petals: </tspan><tspan fill="#D6B787">int</tspan><tspan fill="#E6DFD3">) -&gt; </tspan><tspan fill="#D6B787">str</tspan><tspan fill="#E6DFD3">:</tspan></text>
