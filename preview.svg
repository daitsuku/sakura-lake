    <text x="72" y="652"><tspan fill="#D8959F">--- a/garden.py</tspan><tspan fill="#E6DFD3">    </tspan><tspan fill="#9AA86B">+++ b/garden.py</tspan></text>
    <text x="72" y="682"><tspan fill="#86B5AC">@@ -12,7 +12,7 @@ def season():</tspan></text>
