    <text x="72" y="982"><tspan fill="#E6DFD3">fetching petals  </tspan><tspan fill="#9AA86B">████████</tspan><tspan fill="#4E493D">░░</tspan><tspan fill="#E6DFD3">  80%</tspan></text>
    <text x="72" y="1012"><tspan fill="#E6DFD3">cpu0 </tspan><tspan fill="#9AA86B">██████</tspan><tspan fill="#4E493D">░░░░</tspan><tspan fill="#E6DFD3"> 61%   cpu1 </tspan><tspan fill="#D6B787">████████</tspan><tspan fill="#4E493D">░░</tspan><tspan fill="#D6B787"> 83%</tspan></text>
