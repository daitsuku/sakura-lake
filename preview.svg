<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1280" viewBox="0 0 1280 1280" font-family="'JetBrainsMono Nerd Font','Hack Nerd Font','DejaVu Sans Mono','Cascadia Code',monospace">
