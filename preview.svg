    <text x="72" y="562"><tspan fill="#7FA3B8">~/petals</tspan><tspan fill="#E6DFD3"> on </tspan><tspan fill="#BE8AA2"> main</tspan><tspan fill="#9AA86B"> ❯ </tspan><tspan fill="#E6DFD3">eza -la</tspan></text>
    <text x="72" y="592"><tspan fill="#7FA3B8">drwxr-xr-x  src</tspan><tspan fill="#E6DFD3">   Cargo.toml  </tspan><tspan fill="#9AA86B">run.sh*</tspan><tspan fill="#E6DFD3">  </tspan><tspan fill="#86B5AC">docs -&gt; ~/wiki</tspan></text>
